# Real host config drop-in, deploy step is MANUAL (see config/host/README.md
# -- same "no automated deploy step" convention as systemd/README.md) --
# copy to /etc/systemd/journald.conf.d/veridian-disk-cap.conf then
# `systemctl restart systemd-journald`.
#
# Root cause this caps (UMR-20260814-033442-c885, P0 disk exhaustion RCA):
# `journalctl --disk-usage` reported 3.6G on the same volume that hit 100%
# full (/dev/sda1, 301G total) with NO SystemMaxUse set at all (the live
# /etc/systemd/journald.conf's own SystemMaxUse= line was commented out,
# i.e. journald's real default cap, which is a FRACTION of the actual
# filesystem's free space at journald-start time -- not a fixed, safe,
# reasoned bound someone chose). journald was the SECOND unbounded grower
# found on this volume alongside the leaked test-harness scratch (the
# primary root cause, fixed in the test files themselves) and syslog (see
# config/host/logrotate.d/rsyslog-veridian-cap in this same directory).
#
# 1G is a real, deliberate cap: generous enough for real incident forensics
# (the growth that mattered here was ~3.6G total across the whole journal,
# not any single day), small enough that journald can never again be a
# meaningful contributor to a 301G volume filling up.
[Journal]
SystemMaxUse=1G
SystemKeepFree=2G
